    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="registration">
    <h1>Register</h1>
    <div class="signin">
       <form action="connect.php" method="post">
        <label for="email">
           <p>Email</p> 
            <input type="email" placeholder="Enter valid your email" name="email" required>

        </label>
        <label for="password">
            <p>Password</p>
            <input type="password" placeholder="xxxxxxxx" name="password" required>
        </label>
    </div>
    <div class="btn-btn">
        <button class="confirm">Confirm login</button>
        <button class="reset">Reset</button>
    </div>
</form>
    <footer>
    <h5>Already have an account?<span><a href="./signup.html">Sign in</a></span></h5>

</div>
